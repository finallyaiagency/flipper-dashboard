        const years = ['2024', '2025', '2026'];
        const colors = { '2024': '#ffb84a', '2025': '#55d6ff', '2026': '#42f5a7' };
        const SHEET_ID = '12TELzT2bzIxdry3pyLvSv3hdWJpkdvGC25aSlvsBq94';
        let metric = 'count';
        const metricConfig = {
            count: { label: 'Units Sold Per Month', axis: 'Units Sold', hover: 'units', prefix: '', format: ',.0f' },
            revenue: { label: 'Revenue Per Month', axis: 'Revenue', hover: 'revenue', prefix: '$', format: '$,.0f' },
            profit: { label: 'Gross Profit Per Month', axis: 'Gross Profit', hover: 'profit', prefix: '$', format: '$,.0f' }
        };

        let monthlyData = {};
        let rawSalesRecords = [];

        function parseNumber(value) {
            const number = Number(String(value ?? '').replace(/[$,% ,]/g, ''));
            return Number.isFinite(number) ? number : 0;
        }

        function parseDate(value) {
            const text = String(value ?? '').trim();
            const gviz = text.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
            if (gviz) return `${gviz[1]}-${String(Number(gviz[2]) + 1).padStart(2, '0')}-${String(gviz[3]).padStart(2, '0')}`;
            const mdy = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            return mdy ? `${mdy[3]}-${mdy[1].padStart(2, '0')}-${mdy[2].padStart(2, '0')}` : '';
        }

        function getFilteredMonthlyData() {
            const ignoreZero = document.getElementById('toggle-ignore-zero')?.checked ?? true;
            const filtered = {};
            years.forEach(y => { filtered[y] = new Array(12).fill(0); });
            
            let ignored = 0;
            rawSalesRecords.forEach(record => {
                const date = parseDate(record['Sold Date'] || record['Date sold']);
                if (!date) return;
                const year = date.slice(0, 4);
                const month = parseInt(date.slice(5, 7), 10) - 1;
                
                const costBasis = parseNumber(record['Cost Basis'] || record['Cost Basis']);
                if (ignoreZero && costBasis <= 0) {
                    ignored++;
                    return;
                }
                
                if (filtered[year] && month >= 0 && month < 12) {
                    const key = `${year}-${String(month + 1).padStart(2, '0')}`;
                    if (!monthlyData[key]) monthlyData[key] = { count: 0, revenue: 0, profit: 0 };
                    filtered[year][month] += 1;
                }
            });
            
            // Update monthlyData counts based on filtered data
            years.forEach(year => {
                for (let m = 0; m < 12; m++) {
                    const key = `${year}-${String(m + 1).padStart(2, '0')}`;
                    if (monthlyData[key]) {
                        monthlyData[key].count = filtered[year][m];
                    }
                }
            });
            
            const status = document.getElementById('sales-source');
            if (status) {
                const totalUnits = Object.values(filtered).flat().reduce((a, b) => a + b, 0);
                let msg = `Live sales data · ${totalUnits} units shown`;
                if (ignored > 0) msg += ` (${ignored} zero-cost excluded)`;
                status.textContent = msg;
            }
            
            return monthlyData;
        }

        async function loadLiveSales() {
            const status = document.getElementById('sales-source');
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent('Sales Ledger')}&range=A1:L1000&headers=1&tqx=out:json`;
                const response = await fetch(url, { cache: 'no-store' });
                const text = await response.text();
                const payload = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
                const headers = payload.table.cols.map((col, index) => col.label || col.id || `Column ${index + 1}`);
                
                rawSalesRecords.length = 0;
                (payload.table.rows || []).forEach(row => {
                    const record = Object.fromEntries(headers.map((header, index) => [header, row.c?.[index]?.v ?? '']));
                    rawSalesRecords.push(record);
                });
                
                // Build base monthlyData from all records (revenue/profit not filtered)
                monthlyData = {};
                rawSalesRecords.forEach(record => {
                    const date = parseDate(record['Sold Date'] || record['Date sold']);
                    if (!date) return;
                    const key = date.slice(0, 7);
                    if (!monthlyData[key]) monthlyData[key] = { count: 0, revenue: 0, profit: 0 };
                    monthlyData[key].revenue += parseNumber(record['Sale Price'] || record['Sale price']);
                    monthlyData[key].profit += parseNumber(record['Gross Profit'] || record['Profit']);
                });
                
                getFilteredMonthlyData();
                render();
            } catch (error) {
                if (status) status.textContent = 'Showing cached sales data';
                getFilteredMonthlyData();
                render();
            }
        }

        function buildTraces() {
            const traces = [];
            years.forEach(year => {
                const counts = [];
                for (let m = 1; m <= 12; m++) {
                    const key = `${year}-${String(m).padStart(2, '0')}`;
                    counts.push(monthlyData[key]?.[metric] || 0);
                }
                traces.push({
                    name: year,
                    type: 'scatter',
                    mode: 'lines+markers',
                    x: months,
                    y: counts,
                    line: { color: colors[year], width: 3, shape: 'spline', smoothing: 1.15 },
                    marker: { color: colors[year], size: 7, line: { color: '#101411', width: 1 } },
                    fill: 'tozeroy',

                    connectgaps: true,
                    hovertemplate: `<b>${year}</b><br>%{x}: %{y:${metricConfig[metric].format}} ${metricConfig[metric].hover}<extra></extra>`

            });
            return traces;
        }

        }

        document.getElementById('toggle-2024').addEventListener('change', render);
        document.getElementById('toggle-2025').addEventListener('change', render);
        document.getElementById('toggle-2026').addEventListener('change', render);
        document.getElementById('toggle-ignore-zero').addEventListener('change', render);
        document.querySelectorAll('input[name="metric"]').forEach(input => input.addEventListener('change', event => {
            metric = event.target.value;
            render();
        }));

        render();
        loadLiveSales();
    </script>
</body>
</html>
